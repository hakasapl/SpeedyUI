[General]
# bEnabled turns the plugin on or off. When false, no hook is installed and every menu runs at
# the frame rate in its own file.
bEnabled=true
# fTargetFPS is the frame rate given to every included menu running below it. Animations and
# per-frame logic speed up with it: a 30 FPS menu at 60 plays at 2x speed, a 24 FPS menu at 2.5x.
# Menus already at or above this value are left alone, so this never slows anything down.
fTargetFPS=60.0
# sAllowlist and sBlocklist are comma-separated flash filenames, without paths and not
# case-sensitive. For example: sBlocklist=statsmenu.swf, messagebox.swf
#   Empty sAllowlist = every menu is included
#   Anything in sAllowlist = only those menus are included
#   sBlocklist is applied after sAllowlist, so a file in both is excluded
# Only a menu's main file counts. Files loaded inside a menu, such as itemcard.swf or fonts_en.swf,
# always run at the speed of that menu. SpeedyUI.log in the SKSE log folder lists every
# main file seen in the current session and what happened to it.
sAllowlist=
sBlocklist=hudmenu.swf
