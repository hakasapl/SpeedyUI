[General]
# bEnabled turns the plugin on or off. When false, no hook is installed and every menu runs at
# the frame rate in its own file.
bEnabled=true
# sMode picks how menus are made smoother. Not case-sensitive.
#   interpolated = every menu keeps its own frame rate and speed. Frames are interpolated at runtime
#                  meaning the menu speed stays the same, it just gets smoother.
#   fps          = every menu running below fTargetFPS is given that frame rate instead. Everything
#                  in a menu gets smoother, but everything also speeds up: a 30 FPS menu at 60 plays
#                  its animations and per-frame logic at 2x speed for example.
sMode=interpolated
# fTargetFPS is the frame rate sMode=fps gives every included menu running below it. Menus already
# at or above this value are left alone, so this never slows anything down. Not used by
# sMode=interpolated.
fTargetFPS=60.0
# sAllowlist and sBlocklist are comma-separated flash filenames, without paths and not
# case-sensitive. For example: sBlocklist=statsmenu.swf, messagebox.swf
#   Empty sAllowlist = every menu is included
#   Anything in sAllowlist = only those menus are included
#   sBlocklist is applied after sAllowlist, so a file in both is excluded
# Excluded menus are left alone in either mode.
# SpeedyUI.log in the SKSE log folder lists every main file seen in the current session
sAllowlist=
sBlocklist=hudmenu.swf
